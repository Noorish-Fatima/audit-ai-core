name: CI

on: [push]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:api
      ENVIRONMENT: test
      # Fake placeholders only — tests mock all LLM providers, never call them.
      # SECRET_KEY must satisfy the app's >=32 char validation; this value is
      # NOT a real secret and is only used to boot Settings in CI.
      GROQ_API_KEY: fake-ci-key
      GEMINI_API_KEY: fake-ci-key
      SECRET_KEY: fake-ci-secret-key-for-testing-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install ruff
          pip install -r api/requirements.txt
      - name: Lint (ruff)
        run: ruff check api/app worker/tasks scripts/ tests/
      - name: Unit tests (no live services, no live LLM calls)
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint (eslint, errors fail the build)
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
