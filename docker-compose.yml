networks:
  audit-ai-network:
    driver: bridge
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: audit-ai-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
    - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/audit_ai
    - REDIS_URL=redis://redis:6379/0
    - CELERY_BROKER_URL=redis://redis:6379/1
    - CELERY_RESULT_BACKEND=redis://redis:6379/2
    - DEBUG=true
    - ENVIRONMENT=production
    - CORS_ORIGINS=["http://localhost:3000","http://frontend:3000"]
    - SECRET_KEY=${SECRET_KEY}
    - TIER=${TIER}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      timeout: 10s
    networks:
    - audit-ai-network
    ports:
    - 8000:8000
    volumes:
    - ./api/app:/app/app
    - ./api/alembic:/app/alembic
    - ./api/alembic.ini:/app/alembic.ini
    - storage_data:/app/storage
  db:
    container_name: audit-ai-db
    environment:
      POSTGRES_DB: audit_ai
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      timeout: 5s
    image: postgres:16-alpine
    networks:
    - audit-ai-network
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: audit-ai-frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
    - NEXT_PUBLIC_API_URL=http://api:8000
    - NODE_ENV=production
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000/api/health
      timeout: 10s
    networks:
    - audit-ai-network
    ports:
    - 3000:3000
  redis:
    container_name: audit-ai-redis
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:7-alpine
    networks:
    - audit-ai-network
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    container_name: audit-ai-worker
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
    - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/audit_ai
    - REDIS_URL=redis://redis:6379/0
    - CELERY_BROKER_URL=redis://redis:6379/1
    - CELERY_RESULT_BACKEND=redis://redis:6379/2
    - DEBUG=true
    - ENVIRONMENT=production
    - TIER=${TIER}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test:
      - CMD
      - python
      - -c
      - from worker.celery_app import celery_app; celery_app.control.ping()
      timeout: 10s
    networks:
    - audit-ai-network
    volumes:
    - ./api/app:/app/app
    - ./worker:/app/worker
    - storage_data:/app/storage
version: '3.8'
volumes:
  postgres_data: null
  redis_data: null
  storage_data: null
